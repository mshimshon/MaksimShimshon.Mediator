name: Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    if: github.event.base_ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Extract version
        id: get_version
        run: |
          mkdir -p "/tmp/artifacts/output"
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build All Projects
        run: dotnet build ./src/MaksimShimshon.Mediator.slnx  --configuration Release

      - name: Pack NuGet packages
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PROJECT="${{ github.workspace }}/src/MaksimShimshon.Mediator/MaksimShimshon.Mediator.csproj"
          dotnet pack $PROJECT -c Release -o "/tmp/artifacts/output" /p:Version=$VERSION

